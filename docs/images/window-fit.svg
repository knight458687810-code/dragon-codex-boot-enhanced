<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><style>text{font-family:Segoe UI,Microsoft YaHei,sans-serif;fill:#e2e8f0}.title{font-size:30px;font-weight:700}.label{font-size:22px}.small{font-size:17px;fill:#a6b5cb}</style><rect width="1200" height="660" rx="20" fill="#101827"/><text x="45" y="60" class="title">遮罩随窗口，视频保比例</text><text x="45" y="95" class="small">功能原理示意 · 非实机截图 · 最大化只匹配对应客户区</text>
<rect x="45" y="145" width="520" height="350" rx="12" fill="#202d42" stroke="#64748b" stroke-width="2"/><text x="70" y="183" class="label">显示器 A</text>
<rect x="145" y="215" width="322" height="232" fill="#070c16" stroke="#49d3ad" stroke-width="4"/><rect x="147" y="241" width="318" height="179" fill="#27586b"/><text x="215" y="333" class="label">16 : 9 视频</text><text x="167" y="480" class="small">仅目标客户区有遮罩</text>
<rect x="610" y="145" width="545" height="350" rx="12" fill="#202d42" stroke="#64748b" stroke-width="2"/><text x="635" y="183" class="label">显示器 B</text><text x="710" y="325" class="label">其他区域保持可见</text><text x="709" y="362" class="small">不创建整屏 / 多屏白幕兜底</text>
<text x="45" y="555" class="label">最小化 → 恢复位置　｜　隐藏 → 实际客户区　｜　重建 → 新窗口事件校准</text><text x="45" y="604" class="small">无可靠位置则等待实际窗口，不猜测整屏；示意图不代表所有时序下逐帧零露出。</text></svg>